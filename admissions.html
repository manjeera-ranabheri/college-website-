<link rel="stylesheet" href="style.css">
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Admission Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 50%;
      margin: 30px auto;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    label {
      font-weight: bold;
      display: block;
      margin: 10px 0 5px;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .btn {
      display: inline-block;
      width: 48%;
      padding: 10px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-submit {
      background: #27ae60;
      color: white;
    }
    .btn-reset {
      background: #e74c3c;
      color: white;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <!-- College Name Header -->
<header class="college-header">
  My College
</header>

<!-- Blue Line under header -->
<div class="header-line"></div>

    <nav>
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="courses.html">Courses</a>
  <a href="faculty.html">Faculty</a>

  <a href="events.html">Events</a>
  <a href="gallery.html">Gallery</a>
  <a href="studentlife.html">Student Life</a>
  <a href="achievements.html">Achievements</a>
  <a href="contact.html">Contact</a>
  <a href="team.html">Team</a>
</nav>
<hr>
  <div class="container">
    <h1>College Admission Form</h1>
    <form action="#" method="post">
      
      <label for="fname">Full Name</label>
      <input type="text" id="fname" name="fullname" placeholder="Enter your full name" required>

      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob" required>

      <label for="gender">Gender</label>
      <select id="gender" name="gender" required>
        <option value="">-- Select --</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

      <label for="course">Course Applying For</label>
      <select id="course" name="course" required>
        <option value="">-- Select Course --</option>
        <option value="bsc">B.Sc</option>
        <option value="bcom">B.Com</option>
        <option value="ba">B.A</option>
        <option value="btech">B.Tech</option>
        <option value="mba">MBA</option>
      </select>

      <label for="address">Permanent Address</label>
      <textarea id="address" name="address" rows="4" placeholder="Enter your address" required></textarea>

      <div style="display:flex; justify-content:space-between;">
        <button type="submit" class="btn btn-submit">Submit</button>
        <button type="reset" class="btn btn-reset">Reset</button>
      </div>

    </form>
  </div>
</body>
</html>
